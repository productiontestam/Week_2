name: my-simple-lab

mgmt:
  network: my-lab-mgmt
  ipv4-subnet: 10.10.10.0/24

topology:
  nodes:
    switch1:
      kind: linux
      image: alpine:latest
      mgmt-ipv4: 10.10.10.4
      cmd: sleep infinity
      exec:
        - apk add --no-cache iproute2
        - ip link add name br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set br0 up
        - ip link set eth1 up
        - ip link set eth2 up

    router1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      mgmt-ipv4: 10.10.10.2
      startup-config: router1/frr.conf

    server1:
      kind: linux
      image: server1-custom:1.0
      mgmt-ipv4: 10.10.10.3
      env:
        SNMP_COMMUNITY: "${SNMP_COMMUNITY}"
      exec:
        - ip addr add 192.168.20.10/24 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["switch1:eth1", "router1:eth1"]
    - endpoints: ["switch1:eth2", "server1:eth1"]
